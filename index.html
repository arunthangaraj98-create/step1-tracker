  @media (prefers-color-scheme: dark){ #authGate{background:#151C2C;} }

  #authGate .secondary{background:transparent;color:#6B8FD4;}
  #authGate .ghost{background:transparent;color:#94A3B8;font-weight:500;font-size:12px;text-decoration:underline;margin-top:14px;cursor:pointer;border:none;width:auto;}

  #syncBadge{position:fixed;top:12px;right:14px;z-index:998;font-family:'Inter',sans-serif;font-size:11px;color:#94A3B8;background:rgba(255,255,255,0.85);border:1px solid #E2E8F0;border-radius:20px;padding:5px 12px;cursor:pointer;backdrop-filter:blur(4px);}

<body>

<!-- ═══════════════ CLOUD SYNC (Firebase) ═══════════════ -->
<div id="authGate">
  <div class="card">
    <h2 id="gateTitle">Loading…</h2>
    <p class="sub" id="gateSub">Checking sync status</p>
    <div id="gateForm" style="display:none">
      <input id="gateEmail" type="email" placeholder="Email" autocomplete="email"/>
      <input id="gatePw" type="password" placeholder="Password (6+ chars)" autocomplete="current-password"/>
      <button class="primary" id="gateSignIn">Sign In</button>
      <button class="secondary" id="gateSignUp">Create Account</button>
      <p class="err" id="gateErr"></p>
      <button class="ghost" id="gateSkip">Continue without sync (this device only)</button>
    </div>
  </div>
</div>
<div id="syncBadge" style="display:none"></div>

<script>
// ── 1. Firebase project config ──────────────────────────────────────────
// Replace these with the values from your OWN Firebase project:
// console.firebase.google.com → your project → ⚙️ Project settings → General
// → scroll to "Your apps" → Web app → SDK setup and configuration → Config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const FB_CONFIGURED = firebaseConfig.apiKey !== "YOUR_API_KEY";
let fbAuth = null, fbDb = null, fbUser = null, syncTimer = null;

const LS_PREFIX = "s1t"; // every key this app saves starts with s1t

function collectLocalData(){
  const out = {};
  for (let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if (k && k.indexOf(LS_PREFIX)===0) out[k] = localStorage.getItem(k);
  }
  return out;
}

function scheduleCloudPush(){
  if (!fbUser || !fbDb) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{
    const data = collectLocalData();
    data._updatedAt = Date.now();
    fbDb.collection("users").doc(fbUser.uid).set(data, {merge:true})
      .then(()=>setBadge("Synced ✓"))
      .catch(err=>{console.error("Cloud sync failed:",err); setBadge("Sync error");});
  }, 1200);
}

// Patch localStorage so every existing save call in the app also triggers a cloud push
const _origSetItem = localStorage.setItem.bind(localStorage);
const _origRemoveItem = localStorage.removeItem.bind(localStorage);
localStorage.setItem = function(key, value){
  _origSetItem(key, value);
  if (key.indexOf(LS_PREFIX)===0) { setBadge("Syncing…"); scheduleCloudPush(); }
};
localStorage.removeItem = function(key){
  _origRemoveItem(key);
  if (key.indexOf(LS_PREFIX)===0) scheduleCloudPush();
};

function setBadge(text){
  const b = document.getElementById("syncBadge");
  if (!fbUser){ b.style.display="none"; return; }
  b.style.display="block";
  b.textContent = "☁ " + (fbUser.email||"synced") + " · " + text;
}

function showGateForm(err){
  document.getElementById("gateTitle").textContent = "Sync your tracker";
  document.getElementById("gateSub").textContent = "Sign in with the same account on every device to keep progress in sync.";
  document.getElementById("gateForm").style.display = "block";
  document.getElementById("gateErr").textContent = err || "";
}
function hideGate(){ document.getElementById("authGate").style.display = "none"; }

function mountApp(){
  if (window.__mountApp) window.__mountApp();
  else window.__pendingMount = true; // babel script hasn't finished parsing yet
}

function pullCloudThenMount(){
  fbDb.collection("users").doc(fbUser.uid).get().then(snap=>{
    if (snap.exists){
      const data = snap.data();
      Object.keys(data).forEach(k=>{
        if (k.indexOf(LS_PREFIX)===0) _origSetItem(k, data[k]);
      });
    }
    setBadge("Synced ✓");
    hideGate();
    mountApp();
  }).catch(err=>{
    console.error("Cloud pull failed:", err);
    setBadge("Offline (using local copy)");
    hideGate();
    mountApp();
  });
}

if (!FB_CONFIGURED) {
  // No Firebase project set up yet — just run locally, no sync.
  document.getElementById("authGate").style.display = "none";
  mountApp();
} else {
  firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();

  fbAuth.onAuthStateChanged(user=>{
    if (user){
      fbUser = user;
      pullCloudThenMount();
    } else {
      showGateForm();
    }
  });

  document.getElementById("gateSignIn").onclick = ()=>{
    const email = document.getElementById("gateEmail").value.trim();
    const pw = document.getElementById("gatePw").value;
    fbAuth.signInWithEmailAndPassword(email, pw).catch(e=>showGateForm(e.message));
  };
  document.getElementById("gateSignUp").onclick = ()=>{
    const email = document.getElementById("gateEmail").value.trim();
    const pw = document.getElementById("gatePw").value;
    fbAuth.createUserWithEmailAndPassword(email, pw).catch(e=>showGateForm(e.message));
  };
  document.getElementById("gateSkip").onclick = ()=>{
    hideGate();
    mountApp();
  };
}

document.getElementById("syncBadge").onclick = ()=>{
  if (fbUser && confirm("Sign out of sync on this device?")) {
    fbAuth.signOut().then(()=>location.reload());
  }
};
</script>

function flatten() {
  const a = [];
  Object.entries(DATA).forEach(([fa, d]) => {
    ["bnb","sketchy"].forEach(res => {
      if (!d[res]) return;
      Object.entries(d[res]).forEach(([cat, subs]) => {
        Object.entries(subs).forEach(([sub, vids]) => {
          vids.forEach(v => {
            const name = v[0], dur = v[1] || 0;
            a.push({ id: `${res}|${fa}|${cat}|${sub}|${name}`, fa, cat, sub, name, dur, res });
          });
        });
      });
    });
  });
  return a;
}

    slot2Order.forEach(fa=>{ALL.filter(v=>v.fa===fa&&!dm[v.id]).forEach(v=>slot2Vids.push(v));});
    const microBnB = ALL.filter(v=>v.fa==="Microbiology"&&v.res==="bnb"&&!dm[v.id]);
    const microSK = ALL.filter(v=>v.fa==="Microbiology"&&v.res==="sketchy"&&!dm[v.id]);
    const microVids = [];
    for(let i=0;i<Math.max(microBnB.length,microSK.length);i++){
      if(i<microBnB.length) microVids.push(microBnB[i]);
      if(i<microSK.length) microVids.push(microSK[i]);
    }
    // System videos in order, undone only
    const sysVidQueues = {};
    sysOrder.forEach(sys=>{ sysVidQueues[sys]=ALL.filter(v=>v.fa===sys&&!dm[v.id]); });

    // Calculate study days from today to exam minus 30 (UWorld review period)
    const examD = new Date(exam || "2026-10-26");
    const maxDate = new Date(examD); maxDate.setDate(maxDate.getDate()-21);

    // Distribute from today forward
    let bi=0, s2i=0, mi=0;
    let curSysIdx = 0;
    // Figure out which system we should be on based on what's done
    for(let i=0;i<sysOrder.length;i++){
      if(sysVidQueues[sysOrder[i]].length > 0){ curSysIdx=i; break; }
    }
    let sysVidIdx = 0;
    let d = new Date(t0+"T12:00:00");

    for(let dayOff=0; dayOff<120 && (bi<biochemVids.length||s2i<slot2Vids.length||mi<microVids.length||curSysIdx<sysOrder.length); dayOff++){
      const k = toLocal(d);
      const isSunday = d.getDay() === 0;
      const isBlackout = BLACKOUT.includes(k);

      if (isBlackout) {
        sc[k] = [];
        d.setDate(d.getDate()+1);
        continue;
      }

      sc[k] = [];
      let dayMin = 0;
      const maxMin = REDUCED[k] ? REDUCED[k] : isSunday ? SUNDAY_MAX_MIN : 9999;

      // Slot 1: Biochem — 1/day
      if(bi<biochemVids.length) {
        const v=biochemVids[bi];
        if(dayMin+(v.dur||10) <= maxMin){ sc[k].push(v.id); dayMin+=(v.dur||10); bi++; }
      }
      // Slot 2: Immuno/Path/Pharm/PHS — 1/day
      if(s2i<slot2Vids.length) {
        const v=slot2Vids[s2i];
        if(dayMin+(v.dur||10) <= maxMin){ sc[k].push(v.id); dayMin+=(v.dur||10); s2i++; }
      }
      // Slot 3: Micro — 2/day
      for(let i=0;i<2&&mi<microVids.length;i++){
        const v=microVids[mi];
        if(dayMin+(v.dur||10) <= maxMin){ sc[k].push(v.id); dayMin+=(v.dur||10); mi++; }
      }
      // Slot 4: System of the week
      if(curSysIdx < sysOrder.length){
        const sys = sysOrder[curSysIdx];
        const sq = sysVidQueues[sys];
        const remaining = sq.length - sysVidIdx;
        if(remaining <= 0){ curSysIdx++; sysVidIdx=0; d.setDate(d.getDate()+1); continue; }
        // How many days left in this "week"? Aim for ~7 days per system
        const isReduced = isSunday || !!REDUCED[k];
        const sysPerDay = isReduced ? 2 : Math.max(1, Math.ceil(remaining / 7));
        let added = 0;
        while(sysVidIdx < sq.length && added < sysPerDay) {
          const v = sq[sysVidIdx];
          if(dayMin+(v.dur||10) > maxMin) break;
          sc[k].push(v.id);
          dayMin += (v.dur||10);
          sysVidIdx++; added++;
        }
        // If system is done, move to next
        if(sysVidIdx >= sq.length){ curSysIdx++; sysVidIdx=0; }
      }

      d.setDate(d.getDate()+1);
    }
    return sc;

  const streak = useMemo(()=>{ let c=0,d=new Date(); if(!dLog[toLocal(d)]?.c) d.setDate(d.getDate()-1); while(true){ const k=toLocal(d); if(dLog[k]?.c>0){c++;d.setDate(d.getDate()-1);}else break; } return c; },[dLog]);

  const filtered = useMemo(()=>{ if(!search.trim()) return []; const q=search.toLowerCase(); return ALL.filter(v=>(resFilter==="all"||v.res===resFilter)&&(v.name.toLowerCase().includes(q)||v.sub.toLowerCase().includes(q)||v.cat.toLowerCase().includes(q))).slice(0,40); },[search,resFilter]);

  // Pomodoro timer
  const pomoStart = ()=>{

          if(prev.mode==="work"){

  if(loading) return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><p style={{color:C.txD,fontFamily:"'Outfit'"}}>Loading...</p></div>;

              <span>270</span>
            </div>
            <div style={{marginTop:12,padding:"10px 14px",borderRadius:"var(--r-sm)",background:avg>=TARGET?"var(--grn-d)":avg>=PASS?"var(--pri-d)":"var(--amb-d)",border:`1px solid ${avg>=TARGET?"var(--grn)":avg>=PASS?"var(--pri)":"var(--amb)"}`,fontSize:13,color:C.txt,fontWeight:500}}>
              {avg>=TARGET?"🎉 You're at target level — maintain this and you're ready.":avg>=PASS?`📈 You're passing. Need ${TARGET-avg} more points to hit 230. Keep grinding.`:`⚠️ ${PASS-avg} points below passing. Focus on weak systems and UWorld incorrects.`}
            </div>
          </div>}

          {/* Score history chart */}
          {nbme.length>0&&<div style={{...S.cd,marginBottom:12}}>
            <div style={{fontSize:15,fontWeight:600,color:C.txt,marginBottom:16}}>Score History</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:8,height:120,padding:"0 4px"}}>
              {nbme.map((e,i)=>{
                const pred=pctToStep1(e.pct)||0;
                const h=Math.max(10,Math.round((pred-160)/(270-160)*100));
                const col=pred>=TARGET?"var(--grn)":pred>=PASS?"var(--pri)":"var(--amb)";
                return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                  <div style={{fontSize:11,fontWeight:700,color:col,fontFamily:"'JetBrains Mono'"}}>{pred}</div>
                  <div style={{width:"100%",height:`${h}%`,background:col,borderRadius:"6px 6px 0 0",transition:"height 0.4s ease",minHeight:8}}/>
                  <div style={{fontSize:10,color:C.txM,textAlign:"center",lineHeight:1.2}}>{e.form}</div>
                  <div style={{fontSize:9,color:C.txD}}>{e.date?.slice(5)}</div>
                </div>;
              })}
            </div>
            {/* Reference lines label */}
            <div style={{display:"flex",gap:16,marginTop:10,fontSize:11}}>
              <span style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:12,height:3,background:"var(--amb)",borderRadius:2}}/><span style={{color:C.txM}}>214 Pass</span></span>
              <span style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:12,height:3,background:"var(--grn)",borderRadius:2}}/><span style={{color:C.txM}}>230 Target</span></span>
            </div>
          </div>}
          </>);
        })()}

        {/* Log new score */}
        <div style={{...S.cd}}>
          <div style={{fontSize:16,fontWeight:700,color:C.txt,marginBottom:16}}>Log a New Score</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr auto",gap:10,alignItems:"end"}}>
            <div>
              <label style={S.lbl}>Exam Form</label>
              <select value={nbmeForm} onChange={e=>setNbmeForm(e.target.value)} style={{...S.di,height:42}}>
                <option value="">Select form…</option>
                {Object.keys(NBME_CONV).map(k=><option key={k} value={k}>{k}</option>)}
              </select>
            </div>
            <div>
              <label style={S.lbl}>Date Taken</label>
              <input type="date" value={nbmeDate} onChange={e=>setNbmeDate(e.target.value)} style={{...S.di,height:42}}/>
            </div>
            <div>
              <label style={S.lbl}>% Correct</label>
              <input type="number" min="0" max="100" placeholder="e.g. 72" value={nbmePct} onChange={e=>setNbmePct(e.target.value)} style={{...S.di,height:42}}/>
            </div>
            <div>
              <label style={S.lbl}>Predicted</label>
              <div style={{height:42,display:"flex",alignItems:"center",padding:"0 14px",borderRadius:"var(--r-sm)",border:`1px solid ${C.bdr}`,background:C.bg,fontSize:18,fontWeight:800,fontFamily:"'JetBrains Mono'",color:C.pri}}>{nbmePct?pctToStep1(nbmePct)||"—":"—"}</div>
            </div>
            <button onClick={()=>{
              if(!nbmeForm||!nbmePct) return flash("Select a form and enter % correct");
              const entry={form:nbmeForm,date:nbmeDate,pct:parseFloat(nbmePct),predicted:pctToStep1(nbmePct)};
              const n=[...nbme,entry].sort((a,b)=>a.date.localeCompare(b.date));
              saveNbme(n); setNbmeForm(""); setNbmePct(""); setNbmeDate(today()); flash(`✓ ${nbmeForm} logged — predicted ${entry.predicted}`);
            }} style={{...S.btn,width:"auto",padding:"0 22px",height:42,whiteSpace:"nowrap"}}>+ Log Score</button>
          </div>
          <p style={{fontSize:12,color:C.txM,marginTop:10}}>Enter your % correct from the NBME score report. The predicted 3-digit score uses published USMLE correlation data.</p>
        </div>

        {/* Score log table */}
        {nbme.length>0&&<div style={{...S.cd}}>
          <div style={{fontSize:15,fontWeight:600,color:C.txt,marginBottom:14}}>All Exams</div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{borderBottom:`2px solid ${C.bdr}`}}>
                {["Form","Date","% Correct","Predicted Score","vs Target",""].map(h=><th key={h} style={{textAlign:"left",padding:"6px 10px",color:C.txM,fontWeight:600,fontSize:11,textTransform:"uppercase",letterSpacing:"0.05em"}}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {[...nbme].reverse().map((e,i)=>{
                const pred=pctToStep1(e.pct);
                const gap=pred?pred-230:null;
                return <tr key={i} style={{borderBottom:`1px solid ${C.bdr}`}}>
                  <td style={{padding:"10px 10px",fontWeight:600,color:C.txt}}>{e.form}</td>
                  <td style={{padding:"10px 10px",color:C.txM,fontFamily:"'JetBrains Mono'",fontSize:12}}>{e.date}</td>
                  <td style={{padding:"10px 10px",fontFamily:"'JetBrains Mono'",color:C.txt,fontWeight:600}}>{e.pct}%</td>
                  <td style={{padding:"10px 10px",fontFamily:"'JetBrains Mono'",fontWeight:800,fontSize:16,color:pred>=230?"var(--grn)":pred>=214?"var(--pri)":"var(--amb)"}}>{pred||"—"}</td>
                  <td style={{padding:"10px 10px",fontFamily:"'JetBrains Mono'",fontSize:12,fontWeight:600,color:gap>=0?"var(--grn)":"var(--red)"}}>{gap!==null?(gap>=0?`+${gap} above target`:`${gap} below target`):"—"}</td>
                  <td style={{padding:"10px 6px"}}><button onClick={()=>{const n=nbme.filter((_,j)=>nbme.length-1-j!==i);saveNbme(n);}} style={{background:"var(--amb-d)",border:"1px solid var(--amb)",borderRadius:6,color:"var(--amb)",fontSize:11,padding:"3px 8px",cursor:"pointer",fontWeight:600}}>Remove</button></td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>}
      </div>}

      {tab==="settings"&&<div className="an"><p style={S.pageTitle}>Settings</p><p style={S.pageSub}>Manage your tracker preferences</p>
        <div style={{...S.cd,padding:14}}><div style={{color:C.txt,fontWeight:600,fontSize:13,marginBottom:10}}>Exam Date</div><input type="date" value={exam} onChange={e=>{setExam(e.target.value);save(done,dLog,e.target.value,true,uw,curFA,diff)}} style={S.di}/></div>
        <div style={{...S.cd,padding:14}}>
          <div style={{color:C.txt,fontWeight:600,fontSize:13,marginBottom:6}}>Stats</div>
          <div style={{color:C.txD,fontSize:12,lineHeight:2,fontFamily:"'JetBrains Mono'"}}>
            Total items: {TOTAL} videos + {UW_TOTAL} UW Qs<br/>B&B: {ALL.filter(v=>v.res==="bnb"&&done[v.id]).length}/{BNB_COUNT}<br/>Sketchy: {ALL.filter(v=>v.res==="sketchy"&&done[v.id]).length}/{SK_COUNT}<br/>UWorld: {Object.values(uw).reduce((a,b)=>a+b,0)}/{UW_TOTAL}<br/>Completed videos: {dc}<br/>Remaining: {rem}<br/>Daily target: {target} vids/day<br/>Streak: {streak} days<br/>B&B watch time: {Math.round(TOTAL_MIN/60)}h<br/>Total study hours: {Math.round(Object.values(studyHrs).reduce((a,b)=>a+b,0)/60)}h<br/>Today: {todayHrs}h {todayRemMin}m / 8h goal
          </div>
        </div>
        <div style={{...S.cd,padding:14}}>
          <div style={{color:C.txt,fontWeight:600,fontSize:13,marginBottom:6}}>Days Off / Reduced</div>
          <div style={{color:C.txD,fontSize:11,lineHeight:1.8,fontFamily:"'JetBrains Mono'"}}>
            Apr 17 — half day (off 5pm+)<br/>Apr 18 — full day off<br/>Apr 20 — off 12:30-5pm<br/>Apr 24 — off 2:30-6pm<br/>Apr 28 — full day off<br/>May 2 — full day off<br/>May 16 — off 9-11am (dog vaccine)
          </div>
        </div>
        <div style={{...S.cd,padding:14}}>
          <button onClick={exportProgress} style={{...S.btn,background:C.priD,color:C.pri,border:`1px solid rgba(0,191,165,0.3)`,marginBottom:8}}>Export Progress to Clipboard</button>
          <p style={{color:C.txD,fontSize:10,textAlign:"center"}}>Copy your completed videos list — paste to Claude to transfer progress</p>
        </div>
        <div style={{...S.cd,padding:14,borderColor:"rgba(239,83,80,0.2)"}}>
          <button onClick={()=>{if(confirm("Reset all progress?")){setDone({});setDLog({});setUw({});setCurFA(null);setStudyHrs({});setSessionStart(null);setDiff({});save({},{},exam,true,{},null,{});saveHrs({});try{localStorage.removeItem("s1tSession")}catch(e){}flash("Reset")}}} style={{...S.btn,background:"rgba(239,83,80,0.12)",color:C.red,border:`1px solid rgba(239,83,80,0.2)`}}>Reset All Progress</button>
        </div>
      </div>}
      <div style={{height:24}}/>
      </div>{/* end main */}
    </div>
  );
}

const MOTTOS=["Every session moves you closer to your goal.","Consistency beats intensity — show up today.","Small steps today create big results tomorrow.","Stay the course. Future you will thank you.","You're building momentum — keep going!","One more video. One step closer.","The score you want is built one day at a time."];
const getMotto=(p)=>{if(p>=75)return"You're in the final stretch — finish strong! 💪";if(p>=50)return"Halfway there. You've proven you can do this.";if(p>=25)return"Great start — the foundation is being built.";return MOTTOS[new Date().getDay()%MOTTOS.length];};

function MR({p,c}){const r=20,ci=2*Math.PI*r;return <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r={r} fill="none" stroke="var(--bdr)" strokeWidth="3"/><circle cx="26" cy="26" r={r} fill="none" stroke={c} strokeWidth="3" strokeLinecap="round" strokeDasharray={ci} strokeDashoffset={ci*(1-p/100)} transform="rotate(-90 26 26)" style={{transition:"stroke-dashoffset 0.6s ease"}}/><text x="26" y="30" textAnchor="middle" fill="var(--txt)" fontSize="11" fontWeight="700" fontFamily="'Inter'">{p}%</text></svg>;}

function Stat({l,v,c,s,sub}){return <div style={{background:C.card,borderRadius:"var(--r)",border:`1px solid ${C.bdr}`,padding:"20px 22px",boxShadow:"var(--shadow)"}}><div style={{color:c||C.pri,fontSize:s?18:30,fontWeight:800,fontFamily:"'JetBrains Mono'",letterSpacing:"-0.5px",lineHeight:1}}>{v}</div><div style={{color:C.txM,fontSize:13,marginTop:7,fontWeight:500}}>{l}</div>{sub&&<div style={{color:C.txD,fontSize:11,marginTop:2}}>{sub}</div>}</div>;}

const S = {
  ctr:{minHeight:"100vh",background:C.bg,fontFamily:"'Inter',sans-serif",display:"flex",flexDirection:"row"},
  sidebar:{width:234,minHeight:"100vh",background:C.card,borderRight:`1px solid ${C.bdr}`,display:"flex",flexDirection:"column",padding:"28px 0",flexShrink:0,position:"sticky",top:0,height:"100vh",overflowY:"auto",boxShadow:"var(--shadow)"},
  main:{flex:1,minWidth:0,padding:"36px 44px",overflowY:"auto"},
  h1:{fontFamily:"'Inter'",fontWeight:800,color:C.txt,margin:0,letterSpacing:"-0.7px"},
  cd:{background:C.card,borderRadius:"var(--r)",border:`1px solid ${C.bdr}`,padding:24,marginBottom:12,boxShadow:"var(--shadow)",transition:"box-shadow 0.22s ease"},
  lbl:{display:"block",color:C.txM,fontSize:12,fontWeight:600,marginBottom:7,textTransform:"uppercase",letterSpacing:"0.07em"},
  di:{width:"100%",padding:"11px 15px",borderRadius:"var(--r-sm)",border:`1px solid ${C.bdr}`,background:C.bg,color:C.txt,fontSize:15,fontFamily:"'Inter'",boxSizing:"border-box",outline:"none"},
  btn:{width:"100%",padding:"14px 0",borderRadius:"var(--r-sm)",border:"none",background:C.pri,color:"#fff",fontSize:15,fontWeight:600,cursor:"pointer",fontFamily:"'Inter'",transition:"var(--trans)",boxShadow:"var(--shadow)"},
  hdr:{padding:"0 24px 22px",borderBottom:`1px solid ${C.bdr}`,marginBottom:22},
  strk:{display:"flex",alignItems:"center",gap:6,background:"var(--amb-d)",border:"1px solid var(--amb)",borderRadius:"var(--r-sm)",padding:"8px 16px"},
  tBar:{display:"flex",flexDirection:"column",gap:2,padding:"0 14px"},
  tBtn:{width:"100%",padding:"11px 16px",border:"none",background:"transparent",color:C.txM,fontSize:14,fontWeight:500,fontFamily:"'Inter'",borderRadius:"var(--r-sm)",cursor:"pointer",transition:"var(--trans)",textAlign:"left",display:"flex",alignItems:"center",gap:12},
  toast:{position:"fixed",top:22,left:"50%",transform:"translateX(-50%)",background:C.pri,color:"#fff",padding:"12px 28px",borderRadius:"var(--r-sm)",fontWeight:600,fontSize:14,zIndex:999,fontFamily:"'Inter'",boxShadow:"var(--shadow-lg)"},
  si:{width:"100%",padding:"12px 16px",borderRadius:"var(--r-sm)",border:`1px solid ${C.bdr}`,background:C.card,color:C.txt,fontSize:14,fontFamily:"'Inter'",boxSizing:"border-box",marginBottom:10,outline:"none"},
  uwBtn:{width:32,height:32,borderRadius:"var(--r-sm)",border:`1px solid ${C.bdr}`,background:C.bg,color:C.txM,fontSize:17,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"var(--trans)"},
  grid2:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14},
  grid3:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:14},
  grid4:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:14},
  pageTitle:{fontSize:30,fontWeight:800,color:C.txt,marginBottom:6,letterSpacing:"-1px"},
  pageSub:{fontSize:15,color:C.txM,marginBottom:28,fontWeight:400},
};

window.__mountApp = () => ReactDOM.render(React.createElement(App), document.getElementById('root'));
if (window.__pendingMount) window.__mountApp();
</script>
</body>
</html>
